<title>Tunebox</title>
<style>
:root{--bg:#16132a;--s1:#211d3d;--s2:#2d2850;--tx:#f3f0ff;--mu:#a9a3c9;--ac:#b8a6ff;--am:#ffd27a;--r:14px;
font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx)}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,.row:focus-visible,.card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 6px;display:flex;align-items:center;gap:10px}
header h1{font-size:1.5rem;letter-spacing:-.02em}
#back{display:none;font-size:1.4rem;padding:4px 10px 4px 0}
main{flex:1;overflow-y:auto;padding:6px 18px 24px;-webkit-overflow-scrolling:touch}
h2{font-size:1.1rem;margin:20px 0 10px}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.card{flex:0 0 138px;cursor:pointer}
.card img,.card .ph{width:138px;height:138px;border-radius:var(--r);object-fit:cover;background:var(--s2);display:block}
.card.alb img{border-radius:6px 18px 18px 6px;box-shadow:-5px 0 0 var(--s2),-10px 0 0 var(--s1)}
.card b,.row b{display:block;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span,.row span{color:var(--mu);font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{margin-top:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:14px}
.grid .card,.grid .card img{width:100%;flex:none}.grid .card img{height:auto;aspect-ratio:1}
.row{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer}
.row img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--s2);flex:none}
.row .m{flex:1;min-width:0}.row.on b{color:var(--ac)}
.ib{font-size:1.15rem;padding:8px;color:var(--mu);border-radius:50%}.ib.on{color:var(--am)}
.sb{display:flex;gap:8px;margin:6px 0 12px}
input{flex:1;background:var(--s1);border:1px solid var(--s2);color:var(--tx);border-radius:999px;padding:12px 18px;font:inherit}
.seg{display:flex;gap:8px;margin-bottom:8px}
.seg button{padding:7px 16px;border-radius:999px;background:var(--s1);color:var(--mu);font-size:.88rem}
.seg button.on{background:var(--ac);color:#1b1535;font-weight:600}
.hd{display:flex;gap:16px;align-items:flex-end;margin:6px 0 14px}
.hd img{width:128px;height:128px;border-radius:6px 18px 18px 6px;object-fit:cover;background:var(--s2);box-shadow:-6px 0 0 var(--s2)}
.hd h2{margin:0 0 4px;font-size:1.3rem;line-height:1.2}.hd p{color:var(--mu);font-size:.85rem}
.act{display:flex;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.pill{padding:10px 20px;border-radius:999px;background:var(--ac);color:#1b1535;font-weight:700}
.pill.g{background:var(--s1);color:var(--tx);font-weight:500}
.empty{color:var(--mu);padding:28px 0;text-align:center;font-size:.95rem}
nav{display:flex;background:var(--s1);padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;padding:9px;color:var(--mu);font-size:.8rem;display:flex;flex-direction:column;gap:2px;align-items:center}
nav button i{font-style:normal;font-size:1.25rem}nav button.on{color:var(--ac)}
#mini{display:none;align-items:center;gap:10px;background:var(--s2);margin:0 10px 6px;padding:7px 8px;border-radius:var(--r);cursor:pointer}
#mini img{width:42px;height:42px;border-radius:8px;object-fit:cover}
#mini .m{flex:1;min-width:0}#mini b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini span{font-size:.78rem;color:var(--mu)}
#full{position:fixed;inset:0;background:linear-gradient(var(--s2),var(--bg) 70%);display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 28px calc(env(safe-area-inset-bottom,0px) + 24px);z-index:5;gap:14px}
#full.open{display:flex}
#full .top{align-self:stretch;display:flex;justify-content:space-between}
#fart{width:min(78vw,52vh);aspect-ratio:1;border-radius:20px;object-fit:cover;margin-top:auto;box-shadow:0 20px 50px #0007;background:var(--s2)}
#ft{align-self:stretch;display:flex;align-items:center;gap:8px}
#ft .m{flex:1;min-width:0}#ft b{font-size:1.25rem;display:block}#ft span{color:var(--mu)}
#seek{align-self:stretch;width:100%;accent-color:var(--ac);padding:0}
.tm{align-self:stretch;display:flex;justify-content:space-between;color:var(--mu);font-size:.78rem;margin-top:-8px}
.ctl{display:flex;align-items:center;gap:18px;margin-bottom:auto}.ctl .ib{font-size:1.5rem}
.big{width:68px;height:68px;border-radius:50%;background:var(--ac);color:#1b1535;font-size:1.6rem}
#sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:9}
#sheet.open{display:flex}
#sheet div{background:var(--s1);width:100%;border-radius:20px 20px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:70vh;overflow:auto}
#sheet button{display:block;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--s2)}
@media(min-width:760px){main{padding:6px 8%}header{padding-left:8%}#mini{margin:0 8% 8px}}
@media(prefers-reduced-motion:no-preference){#full.open{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
</style>
</head>
<body>
<header><button id="back" aria-label="Back">‹</button><h1 id="ttl">Tunebox</h1></header>
<main id="main"></main>
<div id="mini"><img id="mart" alt=""><div class="m"><b id="mt"></b><span id="ma"></span></div><button class="ib" id="mp" aria-label="Play or pause">▶</button></div>
<nav>
<button data-t="home" class="on"><i>⌂</i>Home</button>
<button data-t="search"><i>⌕</i>Search</button>
<button data-t="lib"><i>≡</i>Library</button>
</nav>
<section id="full" aria-label="Now playing">
<div class="top"><button class="ib" id="fc" aria-label="Close">⌄</button><button class="ib" id="fq" aria-label="Queue">☰</button></div>
<img id="fart" alt="">
<div id="ft"><div class="m"><b id="ftt"></b><span id="fta"></span></div><button class="ib" id="fl" aria-label="Like">♡</button></div>
<input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
<div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="ctl"><button class="ib" id="sh" aria-label="Shuffle">⇄</button><button class="ib" id="pv" aria-label="Previous">⏮</button><button class="big" id="pp" aria-label="Play or pause">▶</button><button class="ib" id="nx" aria-label="Next">⏭</button><button class="ib" id="rp" aria-label="Repeat">↻</button></div>
</section>
<div id="sheet"><div id="sc"></div></div>
<audio id="au" preload="auto"></audio>
<script>
const B='https://api.audius.co',APP='tunebox',$=s=>document.querySelector(s),au=$('#au');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('tb'))}catch(e){}
S=Object.assign({liked:[],albums:[],lists:[]},S||{});
const save=()=>{try{localStorage.setItem('tb',JSON.stringify(S))}catch(e){}};
const T={},C={};let L=[],Q=[],qi=-1,shuf=false,rep=0,tab='home',backFn=null,qTab='songs',qTxt='';
const api=async p=>{const r=await fetch(B+p+(p.includes('?')?'&':'?')+'app_name='+APP);if(!r.ok)throw 0;return (await r.json()).data};
const art=o=>(o&&o.artwork&&(o.artwork['480x480']||o.artwork['150x150']))||'';
const slim=t=>({id:t.id,title:t.title,duration:t.duration,artwork:t.artwork,user:{name:t.user&&t.user.name}});
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const liked=id=>S.liked.some(t=>t.id==id);
const imgT=o=>`<img src="${esc(art(o))}" alt="" loading="lazy">`;
const rows=ts=>{L=ts;return ts.length?ts.map((t,i)=>{T[t.id]=t;return `<div class="row${Q[qi]&&Q[qi].id==t.id?' on':''}" tabindex="0" data-a="play" data-i="${i}">${imgT(t)}<div class="m"><b>${esc(t.title)}</b><span>${esc(t.user.name)} · ${fmt(t.duration)}</span></div><button class="ib${liked(t.id)?' on':''}" data-a="like" data-id="${t.id}" aria-label="Like">${liked(t.id)?'♥':'♡'}</button><button class="ib" data-a="add" data-id="${t.id}" aria-label="Add to playlist">＋</button></div>`}).join(''):'<p class="empty">Nothing here yet.</p>'};
const cards=cs=>cs.map(c=>{C[c.id]=c;return `<div class="card${c.is_album?' alb':''}" tabindex="0" data-a="open" data-id="${c.id}">${imgT(c)}<b>${esc(c.playlist_name)}</b><span>${esc(c.user&&c.user.name)}</span></div>`}).join('');
const setView=(t,html,back)=>{$('#ttl').textContent=t;$('#main').innerHTML=html;$('#main').scrollTop=0;backFn=back||null;$('#back').style.display=back?'block':'none'};
const loading=()=>$('#main').innerHTML='<p class="empty">Loading…</p>';
const fail=()=>$('#main').innerHTML='<p class="empty">Couldn’t reach Audius. Check your connection and try again.</p>';

async function home(){tab='home';setView('Tunebox','<p class="empty">Loading…</p>');
 try{const[tr,pl]=await Promise.all([api('/v1/tracks/trending?limit=15'),api('/v1/playlists/trending?limit=40')]);
 if(tab!=='home')return;const al=pl.filter(p=>p.is_album),ot=pl.filter(p=>!p.is_album);
 $('#main').innerHTML=(al.length?`<h2>Trending albums</h2><div class="hs">${cards(al)}</div>`:'')+`<h2>Trending songs</h2>${rows(tr)}`+(ot.length?`<h2>Playlists</h2><div class="hs">${cards(ot)}</div>`:'')}catch(e){fail()}}

function search(){tab='search';setView('Search',`<div class="sb"><input id="q" type="search" placeholder="Songs, albums, playlists" value="${esc(qTxt)}" aria-label="Search"></div><div class="seg">${['songs','albums','playlists'].map(k=>`<button data-a="seg" data-k="${k}" class="${k==qTab?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div><div id="res"></div>`);
 $('#q').oninput=e=>{qTxt=e.target.value;clearTimeout(search.t);search.t=setTimeout(runSearch,350)};runSearch()}
async function runSearch(){const r=$('#res');if(!r)return;if(!qTxt.trim()){r.innerHTML='<p class="empty">Type to find music.</p>';return}
 try{const q=encodeURIComponent(qTxt.trim());let h;
 if(qTab=='songs')h=rows(await api('/v1/tracks/search?limit=30&query='+q));
 else{const d=(await api('/v1/playlists/search?limit=40&query='+q)).filter(p=>qTab=='albums'?p.is_album:!p.is_album);h=d.length?`<div class="grid">${cards(d)}</div>`:'<p class="empty">No results.</p>'}
 if($('#res'))$('#res').innerHTML=h}catch(e){if($('#res'))$('#res').innerHTML='<p class="empty">Search failed. Try again.</p>'}}

function lib(){tab='lib';
 setView('Library',`<h2>Liked songs</h2><div class="act"><button class="pill g" data-a="liked">Open ${S.liked.length} liked</button></div>
 <h2>Saved albums</h2>${S.albums.length?`<div class="grid">${cards(S.albums)}</div>`:'<p class="empty">Open an album and tap Save to keep it here.</p>'}
 <h2>My playlists</h2><div class="act"><button class="pill g" data-a="newlist">New playlist</button></div>
 ${S.lists.map((l,i)=>`<div class="row" tabindex="0" data-a="local" data-i="${i}"><div class="m"><b>${esc(l.name)}</b><span>${l.tracks.length} songs</span></div><button class="ib" data-a="dellist" data-i="${i}" aria-label="Delete playlist">✕</button></div>`).join('')}`)}

function detail(title,sub,img,ts,extra,alb){setView(title,`<div class="hd"><img src="${esc(img)}" alt=""><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div></div><div class="act"><button class="pill" data-a="all">Play</button><button class="pill g" data-a="shuf">Shuffle</button>${extra||''}</div>${rows(ts)}`,()=>({home,search,lib})[tab]());}
async function openColl(id){const c=C[id];if(!c)return;setView(c.playlist_name,'<p class="empty">Loading…</p>',()=>({home,search,lib})[tab]());
 try{const ts=await api('/v1/playlists/'+id+'/tracks');
 const sv=S.albums.some(a=>a.id==id);
 detail(c.playlist_name,(c.is_album?'Album':'Playlist')+' · '+(c.user&&c.user.name)+' · '+ts.length+' songs',art(c),ts,`<button class="pill g" data-a="savealb" data-id="${id}">${sv?'Saved ✓':'Save'}</button>`)}catch(e){fail()}}
function liked_(){detail('Liked songs',S.liked.length+' songs','',S.liked)}
function local(i){const l=S.lists[i];detail(l.name,l.tracks.length+' songs','',l.tracks)}

function sheet(html){$('#sc').innerHTML=html;$('#sheet').classList.add('open')}
const closeSheet=()=>$('#sheet').classList.remove('open');
function addTo(id){sheet(`<b>Add to playlist</b>${S.lists.map((l,i)=>`<button data-a="addto" data-i="${i}" data-id="${id}">${esc(l.name)}</button>`).join('')}<button data-a="addnew" data-id="${id}">＋ New playlist</button>`)}
function newList(id){const n=prompt('Playlist name');if(!n||!n.trim())return null;S.lists.push({name:n.trim(),tracks:id?[slim(T[id])]:[]});save();return S.lists.length-1}

function playAt(i,list){if(list){Q=list.slice();}qi=i;const t=Q[qi];if(!t)return;
 au.src=`${B}/v1/tracks/${t.id}/stream?app_name=${APP}`;au.play().catch(()=>{});ui()}
function next(auto){if(!Q.length)return;if(auto&&rep==2){au.currentTime=0;au.play();return}
 let n=shuf?Math.floor(Math.random()*Q.length):qi+1;if(n>=Q.length){if(rep==1||!auto)n=0;else{ui();return}}playAt(n)}
function prev(){if(au.currentTime>3)au.currentTime=0;else playAt((qi-1+Q.length)%Q.length)}
function ui(){const t=Q[qi];if(!t)return;$('#mini').style.display='flex';
 const a=art(t);$('#mart').src=a;$('#fart').src=a;$('#mt').textContent=$('#ftt').textContent=t.title;$('#ma').textContent=$('#fta').textContent=t.user.name;
 const p=!au.paused;$('#mp').textContent=$('#pp').textContent=p?'❚❚':'▶';
 $('#fl').textContent=liked(t.id)?'♥':'♡';$('#fl').classList.toggle('on',liked(t.id));
 $('#sh').classList.toggle('on',shuf);$('#rp').classList.toggle('on',rep>0);$('#rp').textContent=rep==2?'↺1':'↻';
 document.querySelectorAll('.row').forEach(r=>{const x=L[r.dataset.i];r.classList.toggle('on',!!x&&x.id==t.id)});
 if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.user.name,artwork:a?[{src:a,sizes:'480x480'}]:[]});
 navigator.mediaSession.playbackState=p?'playing':'paused'}}
const toggle=()=>{if(!Q.length)return;au.paused?au.play():au.pause()};
function toggleLike(id){const t=T[id]||Q.find(x=>x.id==id);if(!t)return;
 S.liked=liked(id)?S.liked.filter(x=>x.id!=id):[slim(t),...S.liked];save();ui();
 document.querySelectorAll(`[data-a=like][data-id="${id}"]`).forEach(b=>{b.textContent=liked(id)?'♥':'♡';b.classList.toggle('on',liked(id))})}

au.onplay=au.onpause=ui;au.onended=()=>next(true);
au.ontimeupdate=()=>{if(au.duration){$('#seek').value=au.currentTime/au.duration*100;$('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(au.duration)}};
$('#seek').oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration};
$('#mp').onclick=e=>{e.stopPropagation();toggle()};$('#pp').onclick=toggle;$('#nx').onclick=()=>next();$('#pv').onclick=prev;
$('#sh').onclick=()=>{shuf=!shuf;ui()};$('#rp').onclick=()=>{rep=(rep+1)%3;ui()};
$('#fl').onclick=()=>Q[qi]&&toggleLike(Q[qi].id);
$('#mini').onclick=()=>$('#full').classList.add('open');$('#fc').onclick=()=>$('#full').classList.remove('open');
$('#fq').onclick=()=>sheet(`<b>Up next</b>${Q.map((t,i)=>`<button data-a="jump" data-i="${i}">${i==qi?'▶ ':''}${esc(t.title)} — ${esc(t.user.name)}</button>`).join('')}`);
$('#back').onclick=()=>backFn&&backFn();
$('#sheet').onclick=e=>{if(e.target.id=='sheet')closeSheet()};
